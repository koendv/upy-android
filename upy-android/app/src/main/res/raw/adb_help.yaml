name: upy-android adb exec
source: https://github.com/koendv/upy-android
protocol: 2
runtime: MicroPython ports/embed, OpenMV subset
model: each run executes one whole script; no REPL
call: "adb exec-out content call --uri content://eu.kdvelectronics.upyandroid.exec --method <method> [--arg <arg>] [--extra timeout:i:<seconds>]"
reply:
  ok: "Result: Bundle[{output=<text>}]"
  run: "Result: Bundle[{output=<text>, status=ok|exception|timeout, exception=<type name, only with status=exception>}]"
  ack: "Result: Bundle[{}]"
  error: "Result: Bundle[{error=<code>}]"
methods:
  help: this page
  status: protocol, app version, commit, build date, engine connected, busy, screen, foreground, camera available (else why not)
  run: {arg: base64 utf-8 script, extra timeout (seconds, optional): interrupt after it, returns: stdout, traceback, status}
  reset: fresh interpreter
  interrupt: stop running script
errors:
  busy: another script running, possibly from app UI
  disconnected: engine not connected
  disabled: adb exec disabled in app settings
  missing_arg: run without --arg
  bad_base64: arg not valid base64
  unknown_method: see methods
state:
  - globals persist across runs; reset clears
  - run blocks until done, or until the optional timeout; interrupt via second call
  - camera needs screen on, unlocked, app in foreground: check status first
limits:
  output: max 32 KB; longer output ends with ".[truncated]" (1-4 dots); write large results to a file
  script: ~96 KB source; send large data in chunks
env:
  fs: / is app private storage; /examples has samples
  modules: "help('modules')"
  module_help: "csi, display, android (and its submodules), tflite, and litert are upy-android-specific and have a help() function, e.g. import csi; print(csi.help()); android submodules too, e.g. android.location.help()"
  examples: "os.listdir('/examples') lists scripts to use as a pattern for modules without a help() (image, gif, mjpeg, ...)"
  phone: import android
